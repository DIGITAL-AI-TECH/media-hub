name: Worker Health Check (temporary)
on:
  workflow_dispatch:

jobs:
  health-check:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Worker atual - imagem e uptime
        run: |
          docker service ps media-hub_worker --format "table {{.Name}}\t{{.Image}}\t{{.CurrentState}}\t{{.Error}}" | head -10

      - name: Logs recentes do worker (ultimos 5 minutos)
        run: |
          docker service logs media-hub_worker --since 5m --tail 50 2>&1 || echo "Sem logs recentes"

      - name: Verificar processos nos containers do worker
        run: |
          for cid in $(docker ps --filter "name=media-hub_worker" -q); do
            echo "=== Container: $cid ==="
            docker exec $cid ps aux 2>/dev/null | head -10 || echo "ps nao disponivel"
            echo "--- CMD ---"
            docker inspect $cid --format "{{.Config.Cmd}}" 2>/dev/null
            echo "--- Processo PID 1 ---"
            docker exec $cid cat /proc/1/cmdline 2>/dev/null | tr '\0' ' ' || echo "nao disponivel"
            echo ""
          done

      - name: Health check da API
        run: curl -sf https://media.digital-ai.tech/v1/health && echo " OK" || echo "FALHOU"

      - name: Verificar imagem do service
        run: |
          docker service inspect media-hub_worker --format "{{.Spec.TaskTemplate.ContainerSpec.Image}}" 2>/dev/null
          echo "---"
          docker service inspect media-hub_worker --format "{{json .Spec.TaskTemplate.ContainerSpec.Command}}" 2>/dev/null
