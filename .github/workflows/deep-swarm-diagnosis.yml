name: Deep Swarm Diagnosis
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: All running containers (including non-Swarm)
        run: docker ps --format "table {{.Names}}	{{.Image}}	{{.Status}}	{{.Command}}" | head -50

      - name: All stacks
        run: docker stack ls

      - name: Search for celery/rabbitmq in all container commands
        run: docker ps --format "{{.Names}} {{.Command}}" | grep -i "celery\|rabbit\|amqp" || echo "None found"

      - name: Search for Python containers
        run: docker ps --format "{{.Names}}	{{.Image}}" | grep -i "python\|celery\|media-hub" || echo "None found"

      - name: RabbitMQ stack details
        run: |
          docker stack services rabbitmq 2>/dev/null || echo "No rabbitmq stack"
          docker service ls | grep -i rabbit || echo "No rabbit services"

      - name: Check who is connecting to rabbitmq (network connections)
        run: |
          ss -tnp | grep 5672 || echo "No connections to 5672"
          netstat -tnp 2>/dev/null | grep 5672 || echo "netstat not available"

      - name: List ALL docker containers including stopped
        run: docker ps -a --format "table {{.Names}}	{{.Image}}	{{.Status}}" | head -40

      - name: Check any compose projects
        run: docker compose ls 2>/dev/null || echo "No compose projects"
