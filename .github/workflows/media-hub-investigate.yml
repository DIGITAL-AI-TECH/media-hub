name: Qdrant Collections Setup
on:
  workflow_dispatch:
jobs:
  setup-qdrant:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: "Get full QDRANT config from ifans"
        run: |
          echo "=== ALL QDRANT-RELATED ENV VARS ==="
          docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in sorted(envs):
            if 'QDRANT' in e.upper():
              print(e)
          " 2>&1

      - name: "List existing collections via qdrant service name"
        run: |
          # Get QDRANT API key from ifans env
          QDRANT_API_KEY=$(docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in envs:
            if 'QDRANT_API_KEY' in e or 'QDRANT_KEY' in e:
              print(e.split('=',1)[1])
              break
          " 2>/dev/null)
          
          QDRANT_URL=$(docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in envs:
            if e.startswith('QDRANT_URL='):
              print(e.split('=',1)[1])
              break
          " 2>/dev/null)
          
          echo "QDRANT_URL=$QDRANT_URL"
          echo "API_KEY_LENGTH=${#QDRANT_API_KEY}"
          
          if [ -n "$QDRANT_API_KEY" ]; then
            echo "--- Listing collections with API key ---"
            docker run --rm --network oraculusnet_v2 curlimages/curl:latest \
              curl -s "$QDRANT_URL/collections" -H "api-key: $QDRANT_API_KEY" 2>&1
          else
            echo "No API key found, trying without..."
            docker run --rm --network oraculusnet_v2 curlimages/curl:latest \
              curl -s "$QDRANT_URL/collections" 2>&1
          fi

      - name: "Create ifans_content_embeddings collection"
        run: |
          QDRANT_API_KEY=$(docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in envs:
            if 'QDRANT_API_KEY' in e or 'QDRANT_KEY' in e:
              print(e.split('=',1)[1])
              break
          " 2>/dev/null)
          
          QDRANT_URL=$(docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in envs:
            if e.startswith('QDRANT_URL='):
              print(e.split('=',1)[1])
              break
          " 2>/dev/null)
          
          echo "Creating ifans_content_embeddings..."
          docker run --rm --network oraculusnet_v2 curlimages/curl:latest \
            curl -s -X PUT "$QDRANT_URL/collections/ifans_content_embeddings" \
            -H "api-key: $QDRANT_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"vectors":{"size":1536,"distance":"Cosine"},"hnsw_config":{"m":16,"ef_construct":100},"quantization_config":{"scalar":{"type":"int8","always_ram":true}}}' 2>&1

      - name: "Create ifans_user_embeddings collection"
        run: |
          QDRANT_API_KEY=$(docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in envs:
            if 'QDRANT_API_KEY' in e or 'QDRANT_KEY' in e:
              print(e.split('=',1)[1])
              break
          " 2>/dev/null)
          
          QDRANT_URL=$(docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in envs:
            if e.startswith('QDRANT_URL='):
              print(e.split('=',1)[1])
              break
          " 2>/dev/null)
          
          echo "Creating ifans_user_embeddings..."
          docker run --rm --network oraculusnet_v2 curlimages/curl:latest \
            curl -s -X PUT "$QDRANT_URL/collections/ifans_user_embeddings" \
            -H "api-key: $QDRANT_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"vectors":{"size":1536,"distance":"Cosine"},"hnsw_config":{"m":16,"ef_construct":100},"quantization_config":{"scalar":{"type":"int8","always_ram":true}}}' 2>&1

      - name: "Verify collections were created"
        run: |
          QDRANT_API_KEY=$(docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in envs:
            if 'QDRANT_API_KEY' in e or 'QDRANT_KEY' in e:
              print(e.split('=',1)[1])
              break
          " 2>/dev/null)
          
          QDRANT_URL=$(docker service inspect ifans_api --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' 2>/dev/null | python3 -c "
          import sys,json
          envs=json.load(sys.stdin)
          for e in envs:
            if e.startswith('QDRANT_URL='):
              print(e.split('=',1)[1])
              break
          " 2>/dev/null)
          
          echo "=== ALL COLLECTIONS ==="
          docker run --rm --network oraculusnet_v2 curlimages/curl:latest \
            curl -s "$QDRANT_URL/collections" -H "api-key: $QDRANT_API_KEY" 2>&1
          
          echo ""
          echo "=== ifans_content_embeddings info ==="
          docker run --rm --network oraculusnet_v2 curlimages/curl:latest \
            curl -s "$QDRANT_URL/collections/ifans_content_embeddings" -H "api-key: $QDRANT_API_KEY" 2>&1
          
          echo ""
          echo "=== ifans_user_embeddings info ==="
          docker run --rm --network oraculusnet_v2 curlimages/curl:latest \
            curl -s "$QDRANT_URL/collections/ifans_user_embeddings" -H "api-key: $QDRANT_API_KEY" 2>&1
