name: Create Qdrant Collections for ifans
on:
  workflow_dispatch:
jobs:
  create-collections:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: "Create ifans_content_embeddings"
        run: |
          CONTAINER=$(docker ps --filter name=ifans_api -q | head -1)
          echo "Using container: $CONTAINER"
          docker exec $CONTAINER sh -c '
            echo "Creating ifans_content_embeddings..."
            wget -qO- --post-data="{\"vectors\":{\"size\":1536,\"distance\":\"Cosine\"},\"hnsw_config\":{\"m\":16,\"ef_construct\":100},\"quantization_config\":{\"scalar\":{\"type\":\"int8\",\"always_ram\":true}}}" \
              --header="Content-Type: application/json" \
              "http://qdrant:6333/collections/ifans_content_embeddings" \
              --method=PUT 2>&1 || echo "WGET PUT failed, trying alternative..."
          '

      - name: "Create ifans_content_embeddings (alternative method)"
        run: |
          CONTAINER=$(docker ps --filter name=ifans_api -q | head -1)
          # Use node from within the container since it has node
          docker exec $CONTAINER node -e "
            const http = require('http');
            const data = JSON.stringify({
              vectors: { size: 1536, distance: 'Cosine' },
              hnsw_config: { m: 16, ef_construct: 100 },
              quantization_config: { scalar: { type: 'int8', always_ram: true } }
            });
            const req = http.request({
              hostname: 'qdrant', port: 6333,
              path: '/collections/ifans_content_embeddings',
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'Content-Length': data.length }
            }, (res) => {
              let body = '';
              res.on('data', (d) => body += d);
              res.on('end', () => console.log('content_embeddings:', res.statusCode, body));
            });
            req.write(data);
            req.end();
          " 2>&1

      - name: "Create ifans_user_embeddings"
        run: |
          CONTAINER=$(docker ps --filter name=ifans_api -q | head -1)
          docker exec $CONTAINER node -e "
            const http = require('http');
            const data = JSON.stringify({
              vectors: { size: 1536, distance: 'Cosine' },
              hnsw_config: { m: 16, ef_construct: 100 },
              quantization_config: { scalar: { type: 'int8', always_ram: true } }
            });
            const req = http.request({
              hostname: 'qdrant', port: 6333,
              path: '/collections/ifans_user_embeddings',
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'Content-Length': data.length }
            }, (res) => {
              let body = '';
              res.on('data', (d) => body += d);
              res.on('end', () => console.log('user_embeddings:', res.statusCode, body));
            });
            req.write(data);
            req.end();
          " 2>&1

      - name: "Verify collections"
        run: |
          CONTAINER=$(docker ps --filter name=ifans_api -q | head -1)
          echo "=== COLLECTIONS LIST ==="
          docker exec $CONTAINER sh -c 'wget -qO- http://qdrant:6333/collections' 2>&1
          echo ""
          echo "=== ifans_content_embeddings ==="
          docker exec $CONTAINER sh -c 'wget -qO- http://qdrant:6333/collections/ifans_content_embeddings' 2>&1
          echo ""
          echo "=== ifans_user_embeddings ==="
          docker exec $CONTAINER sh -c 'wget -qO- http://qdrant:6333/collections/ifans_user_embeddings' 2>&1
