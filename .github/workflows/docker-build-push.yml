name: Build, Push & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel older runs on the same branch — only latest commit deploys
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digital-ai.tech
  REPO_PREFIX: digital-ai
  STACK: media-hub
  N8N_NOTIFY_URL: https://webhook.digital-ai.tech/webhook/1c708636-864f-469d-8540-0dab5c145c7c

jobs:
  # ─── Detectar quais servicos mudaram ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'packages/api/**'
              - 'shared/**'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
            worker:
              - 'packages/worker/**'
              - 'shared/**'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'

  # ─── Build API ──────────────────────────────────────────────────────────────
  build-api:
    needs: [changes]
    runs-on: [self-hosted, swarm]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Notify — Pipeline Iniciado
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'started','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],'commit_message':os.environ.get('COMMIT_MSG','')[:100],
              'run_url':os.environ['RUN_URL'],
              'stage':'pipeline',
              'message':'Build e deploy iniciados para media-hub'
            }))")" || true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/media-hub-api:latest
            ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/media-hub-api:${{ github.sha }}

      - name: Notify — Build API Concluido
        if: success()
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':'',
              'run_url':os.environ['RUN_URL'],
              'stage':'build',
              'message':'Imagem media-hub-api publicada no registry com sucesso'
            }))")" || true

      - name: Notify — Build API Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':os.environ.get('COMMIT_MSG','')[:100],
              'run_url':os.environ['RUN_URL'],
              'stage':'build',
              'message':'Falha no build ou push da imagem media-hub-api'
            }))")" || true

  # ─── Build Worker ───────────────────────────────────────────────────────────
  build-worker:
    needs: [changes]
    runs-on: [self-hosted, swarm]
    if: needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/media-hub-worker:latest
            ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/media-hub-worker:${{ github.sha }}

      - name: Notify — Build Worker Concluido
        if: success()
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':'',
              'run_url':os.environ['RUN_URL'],
              'stage':'build',
              'message':'Imagem media-hub-worker publicada no registry com sucesso'
            }))")" || true

      - name: Notify — Build Worker Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':os.environ.get('COMMIT_MSG','')[:100],
              'run_url':os.environ['RUN_URL'],
              'stage':'build',
              'message':'Falha no build ou push da imagem media-hub-worker'
            }))")" || true

  # ─── DNS Sync ───────────────────────────────────────────────────────────────
  dns-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Sync DNS Cloudflare (CNAME -> vps.digital-ai.tech)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request
          cf_token = os.environ['CF_API_TOKEN']
          zone_id  = os.environ['CF_ZONE_ID']
          target   = 'vps.digital-ai.tech'
          domains  = ['media.digital-ai.tech']
          headers = {'Authorization': f'Bearer {cf_token}', 'Content-Type': 'application/json'}
          for domain in domains:
              url = f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?name={domain}&type=CNAME'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read())
              payload = json.dumps({'type':'CNAME','name':domain,'content':target,'proxied':False,'ttl':3600}).encode()
              records = data.get('result', [])
              if records:
                  url = f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{records[0]["id"]}'
                  req = urllib.request.Request(url, data=payload, headers=headers, method='PUT')
                  print(f'Atualizando CNAME: {domain} -> {target}')
              else:
                  url = f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records'
                  req = urllib.request.Request(url, data=payload, headers=headers, method='POST')
                  print(f'Criando CNAME: {domain} -> {target}')
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
              if result.get('success'):
                  print(f'  OK: {domain}')
              else:
                  print(f'  FALHOU: {domain} - {result.get("errors")}')
                  raise SystemExit(1)
          EOF

      - name: Notify — DNS Sincronizado
        if: success()
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':'',
              'run_url':os.environ['RUN_URL'],
              'stage':'dns',
              'message':'DNS sincronizado: media.digital-ai.tech -> vps.digital-ai.tech (Cloudflare)'
            }))")" || true

      - name: Notify — DNS Falhou
        if: failure()
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':'',
              'run_url':os.environ['RUN_URL'],
              'stage':'dns',
              'message':'Falha ao sincronizar DNS no Cloudflare — verificar secrets CF_API_TOKEN e CF_ZONE_ID'
            }))")" || true

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    needs: [changes, build-api, build-worker, dns-sync]
    runs-on: [self-hosted, swarm]
    if: >
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    env:
      DATABASE_URL: ${{ secrets.MEDIA_HUB_DATABASE_URL }}
      S3_BUCKET: ${{ secrets.MEDIA_HUB_S3_BUCKET }}
      S3_REGION: ${{ secrets.MEDIA_HUB_S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.MEDIA_HUB_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_HUB_S3_SECRET_ACCESS_KEY }}
      CDN_BASE_URL: ${{ secrets.MEDIA_HUB_CDN_BASE_URL }}
      ALLOWED_ORIGINS: ${{ secrets.MEDIA_HUB_ALLOWED_ORIGINS }}
      ADMIN_KEY: ${{ secrets.MEDIA_HUB_ADMIN_KEY }}
      MH_TOKEN_SECRET: ${{ secrets.MEDIA_HUB_MH_TOKEN_SECRET }}
      REDIS_PASSWORD: ${{ secrets.MEDIA_HUB_REDIS_PASSWORD }}
      VIEWER_JWT_SECRET: ${{ secrets.MEDIA_HUB_VIEWER_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Notify — Deploy em Andamento
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':'',
              'run_url':os.environ['RUN_URL'],
              'stage':'deploy',
              'message':'Iniciando deploy no Docker Swarm'
            }))")" || true

      - name: Deploy no Swarm
        run: |
          set -e
          STACK="${{ env.STACK }}"
          SHA="${{ github.sha }}"
          EVENT="${{ github.event_name }}"
          REGISTRY="${{ env.REGISTRY }}"
          REPO_PREFIX="${{ env.REPO_PREFIX }}"

          update_service() {
            local svc="$1" image="$2"
            echo "==> Verificando: $image"
            if docker pull "$image" > /dev/null 2>&1; then
              docker service update --image "$image" --with-registry-auth "${STACK}_${svc}"
              echo "==> ${svc}: atualizado. Aguardando convergencia..."
              timeout 120 bash -c "
                until docker service ps '${STACK}_${svc}' \
                  --filter 'desired-state=running' \
                  --format '{{.CurrentState}}' | grep -q 'Running'; do
                  sleep 5
                done
              " && echo "==> ${svc}: convergiu OK." || { echo "==> ${svc}: FALHOU ao convergir"; exit 1; }
            else
              echo "==> ${svc}: sem imagem nova. Pulando."
            fi
          }

          STACK_EXISTS=$(docker stack ls --format '{{.Name}}' | grep -qx "${STACK}" && echo "true" || echo "false")

          if [ "$STACK_EXISTS" = "false" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "==> $( [ "$STACK_EXISTS" = "false" ] && echo "PRIMEIRO DEPLOY" || echo "REDEPLOY MANUAL" )"
            export VERSION=latest
            docker stack deploy -c docker-stack.yml "${STACK}" --with-registry-auth
            echo "==> Stack '${STACK}' deployado."
          else
            echo "==> DEPLOY INCREMENTAL — commit: ${SHA:0:7}"
            update_service "api"    "${REGISTRY}/${REPO_PREFIX}/media-hub-api:${SHA}"
            update_service "worker" "${REGISTRY}/${REPO_PREFIX}/media-hub-worker:${SHA}"
          fi

          docker stack ps "${STACK}" --filter "desired-state=running" \
            --format "table {{.Name}}\t{{.Image}}\t{{.CurrentState}}"

      - name: Notify — Deploy Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'success','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':os.environ.get('COMMIT_MSG','')[:100],
              'run_url':os.environ['RUN_URL'],
              'stage':'deploy',
              'message':'media-hub API e Worker atualizados e saudaveis no Swarm'
            }))")" || true

      - name: Notify — Deploy Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'media-hub',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'][:7],
              'commit_message':os.environ.get('COMMIT_MSG','')[:100],
              'run_url':os.environ['RUN_URL'],
              'stage':'deploy',
              'message':'Falha no deploy do Swarm ou convergencia dos servicos'
            }))")" || true
